[package]
name = "gromos-forces"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Force calculations for GROMOS-RS molecular dynamics"

# Physics-convention variable names (kT, dH_dL, etc.) are intentional.
[lints.rust]
non_snake_case = "allow"

[dependencies]
gromos-core = { workspace = true }

# SIMD and math
glam = { workspace = true }
wide = { workspace = true }

# Parallelism
rayon = { workspace = true }

# Logging
log = { workspace = true }

# FFT for PME electrostatics
rustfft = { workspace = true }
fftw = { workspace = true, optional = true }
num-complex = { workspace = true }

# MPI for distributed PME
mpi = { workspace = true, optional = true }

# Serialization
serde = { workspace = true, optional = true }

# In-process ML potential inference (TorchScript via libtorch). Optional: default
# builds/CI are untouched. Building with --features ml requires a matching local
# libtorch — see crates/gromos-forces/src/nonbonded/schnet.rs module docs.
tch = { version = "0.24.0", optional = true }

[features]
default = []
use-fftw = ["fftw"]
use-mpi = ["mpi"]
mpi = ["dep:mpi"]
gpu = []
simd = []
serde = ["dep:serde", "gromos-core/serde"]
ml = ["dep:tch"]

[dev-dependencies]
gromos-io = { workspace = true }
approx = "0.5"
criterion = { workspace = true }

[[bench]]
name = "nonbonded_bench"
harness = false
