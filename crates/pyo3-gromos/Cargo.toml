[package]
name = "pyo3-gromos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Low-level PyO3 bindings for GROMOS-RS molecular dynamics engine"

[lib]
crate-type = ["rlib"]

[dependencies]
# Core Rust library
gromos-core = { workspace = true }
gromos-forces = { workspace = true }
gromos-integrators = { workspace = true }
gromos-io = { workspace = true }
gromos-analysis = { workspace = true }
# The one run builder shared with the md binary (PLAN.md 3.9)
gromos-run = { workspace = true }

# Python bindings
pyo3 = { workspace = true }
numpy = { workspace = true }
# serde <-> Python objects: Recipe / Term / Algorithm are the Rust data types, not copies
pythonize = "0.21"
serde = { workspace = true }
serde_json = { workspace = true }

# SIMD and math

# Parallelism
rayon = { workspace = true }

[features]
default = []
ml = ["gromos-forces/ml", "gromos-run/ml"]
