[package]
name = "gromos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GROMOS-RS molecular dynamics engine - facade crate"

[lib]
# rlib only: a `cdylib`/`staticlib` here writes target/libgromos.{so,a}, the same paths
# py-gromos's extension module (`[lib] name = "gromos"`) writes. Building both in one
# `cargo test --workspace` raced and clobbered them, and the compiler then reported
# "multiple different versions of crate gromos_core". Nothing consumes a C library from
# this facade crate — it has no `extern "C"` surface.
crate-type = ["rlib"]

[dependencies]
# Re-export all sub-crates
gromos-core = { workspace = true }
gromos-forces = { workspace = true }
gromos-integrators = { workspace = true }
gromos-io = { workspace = true }
# NOTE: gromos-analysis is NOT re-exported here to avoid circular dependencies.
# Analysis bins live in the gromos-analysis crate and depend on gromos-core/gromos-io directly.

# Optional features passed through
mpi = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

[features]
default = ["simd"]
simd = []
use-fftw = ["gromos-forces/use-fftw"]
use-mpi = ["mpi", "gromos-forces/use-mpi"]
use-cuda = ["cudarc"]
mimalloc = ["dep:mimalloc"]
serde = ["gromos-core/serde", "gromos-forces/serde", "gromos-io/serde"]

[dev-dependencies]
env_logger = { workspace = true }
