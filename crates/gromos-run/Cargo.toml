[package]
name = "gromos-run"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Run assembly for GROMOS-RS: parameters + topology + coordinates -> AlgorithmSequence. The one builder shared by the md binary and py-gromos (PLAN.md 3.9)."

[dependencies]
gromos-core = { workspace = true }
gromos-forces = { workspace = true }
gromos-integrators = { workspace = true }
gromos-io = { workspace = true }

# The recipe and the plan are plain data: serde is the Rust<->Python bridge (PLAN.md 3.9 A12),
# TOML the human-readable echo (`<run>.recipe.toml`), JSON the machine dump (`md @dump`).
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[features]
default = []
ml = ["gromos-forces/ml"]
